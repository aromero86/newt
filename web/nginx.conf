# VitePress's clean URLs: /manual/06-use-cases is served from /manual/06-use-cases.html.
server {
  listen 80;
  root /usr/share/nginx/html;
  # Behind the TLS proxy: redirects keep the address the browser used.
  absolute_redirect off;
  # The manual was the book once: its old links still lead to it.
  location /book/ {
    rewrite ^/book/(.*)$ /manual/$1 permanent;
  }
  location / {
    try_files $uri $uri.html $uri/ =404;
  }
  error_page 404 /404.html;
}
